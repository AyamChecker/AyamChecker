    <!-- Tailwind CSS CDN -->

    <!-- Google Fonts for Digital Clock & Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #070709;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }

        .font-clock {
            font-family: 'Orbitron', monospace;
        }

        .font-pasaran {
            font-family: 'Chakra Petch', sans-serif;
        }

        /* Glowing Effects */
        .clock-glow {
            text-shadow: 0 0 20px rgba(250, 204, 21, 0.4), 0 0 40px rgba(250, 204, 21, 0.2);
        }

        .border-neon {
            border-color: rgba(234, 179, 8, 0.35);
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.08);
        }

        .border-neon:hover {
            border-color: rgba(234, 179, 8, 0.6);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0d12;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #eab308;
        }

        /* Custom Table Styling */
        .table-row-item {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background-color 0.2s ease;
        }
        .table-row-item:hover {
            background-color: rgba(234, 179, 8, 0.04);
        }
        .table-row-item.checked-row {
            background-color: rgba(34, 197, 94, 0.06);
        }

        /* Pulsing Alarm Button */
        @keyframes pulse-red {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            50% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }
        .animate-pulse-red {
            animation: pulse-red 1.5s infinite;
        }
    </style>
</head>

            { id: 36, name: "KENTUCKYMID", tutup: "00:05 WIB", result: "00:30 WIB", url: "https://www.lotteryusa.com/kentucky/midday-pick-4/" },
            { id: 37, name: "FLORIDAMID", tutup: "00:15 WIB", result: "00:40 WIB", url: "https://www.lotteryusa.com/florida/midday-pick-4/" },
            { id: 38, name: "TURKI", tutup: "00:45 WIB", result: "01:20 WIB", url: "https://turkipools.com/" },
            { id: 39, name: "NEWYORKMID", tutup: "01:05 WIB", result: "01:45 WIB", url: "https://nylottery.ny.gov/draw-game/?game=win4" },
            { id: 40, name: "CAROLINADAY", tutup: "01:45 WIB", result: "02:00 WIB", url: "https://www.lotteryusa.com/north-carolina/midday-pick-4/" },
            { id: 41, name: "MAROKO", tutup: "02:30 WIB", result: "03:00 WIB", url: "https://marokopools.com/" },
            { id: 42, name: "OREGON3", tutup: "02:45 WIB", result: "03:00 WIB", url: "https://www.oregonlottery.org/pick-4/winning-numbers/" },
            { id: 43, name: "OREGON6", tutup: "05:45 WIB", result: "06:00 WIB", url: "https://www.oregonlottery.org/pick-4/winning-numbers/" },
            { id: 44, name: "TASMANIA06", tutup: "06:30 WIB", result: "07:00 WIB", url: "http://www.tasmanialottery.com/" },
            { id: 45, name: "CHICAGONIGHT", tutup: "07:30 WIB", result: "08:00 WIB", url: "https://www.chicagolottery.world/" },
            { id: 46, name: "FLORIDAEVE", tutup: "08:35 WIB", result: "08:55 WIB", url: "https://www.lotteryusa.com/florida/pick-4/" },
            { id: 47, name: "OREGON9", tutup: "08:45 WIB", result: "09:00 WIB", url: "https://www.oregonlottery.org/pick-4/winning-numbers/" }
        ];

        // Status state saved in localStorage
        let statusState = JSON.parse(localStorage.getItem('pasaran_status_state')) || {};
        let isAudioActive = true;
        let audioCtx = null;
        let alarmInterval = null;
        let triggeredKeys = new Set();

        window.onload = function() {
            renderTable();
            startClockAndAlarm();
        };

        // Render Table Rows
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            pasaranData.forEach(item => {
                const isChecked = !!statusState[item.id];
                const tr = document.createElement('tr');
                tr.className = `table-row-item ${isChecked ? 'checked-row' : ''}`;

                tr.innerHTML = `
                    <td class="py-3 px-3 font-bold text-yellow-400 hover:underline">
                        <a href="${item.url}" target="_blank" rel="noopener text-yellow-400 flex items-center gap-1.5">
                            <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-yellow-500"></i>
                            <span>${escapeHtml(item.name)}</span>
                        </a>
                    </td>
                    <td class="py-3 px-3 text-center font-bold text-yellow-400/90">${item.tutup}</td>
                    <td class="py-3 px-3 text-center font-bold text-emerald-400">${item.result}</td>
                    <td class="py-3 px-3 text-center">
                        <button onclick="toggleStatus(${item.id})" class="text-[10px] font-extrabold uppercase px-3 py-1 rounded bg-[#1d1d26] border ${isChecked ? 'border-green-500 text-green-400 bg-green-950/40' : 'border-gray-700 text-gray-400 hover:border-yellow-500'} transition cursor-pointer">
                            ${isChecked ? '✓ SELESAI' : 'AKTIF'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Toggle Status manually
        function toggleStatus(id) {
            statusState[id] = !statusState[id];
            localStorage.setItem('pasaran_status_state', JSON.stringify(statusState));
            renderTable();
        }

        // Clock & Alarm Monitor
        function startClockAndAlarm() {
            setInterval(() => {
                // WIB is UTC + 7
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                const wib = new Date(utc + (3600000 * 7));

                const h = String(wib.getHours()).padStart(2, '0');
                const m = String(wib.getMinutes()).padStart(2, '0');
                const s = String(wib.getSeconds()).padStart(2, '0');

                document.getElementById('digitalClock').innerText = `${h} : ${m} : ${s}`;

                // Check alarms on exact minutes
                const currentHHMM = `${h}:${m}`;
                if (s === '00') {
                    checkAlarmTriggers(currentHHMM);
                }
            }, 1000);
        }

        // Check if any market matches time
        function checkAlarmTriggers(currentHHMM) {
            pasaranData.forEach(item => {
                // Extract clean HH:MM string
                const parseTime = (timeStr) => timeStr.replace('WIB', '').trim().replace('.', ':');
                const resultParsed = parseTime(item.result);

                // ALARM KHUSUS BERBUNYI SAAT JAM RESULT TERCAPAI
                if (resultParsed === currentHHMM) {
                    const key = `${item.id}-RESULT-${currentHHMM}`;
                    if (!triggeredKeys.has(key)) {
                        triggeredKeys.add(key);
                        
                        // Otomatis ubah status pasaran menjadi SELESAI / CHECKLIST
                        statusState[item.id] = true;
                        localStorage.setItem('pasaran_status_state', JSON.stringify(statusState));
                        renderTable();

                        // Sorot baris pasaran yang result
                        highlightResultRow(item.id);

                        // Bunyikan Alarm jika audio aktif
                        if (isAudioActive) {
                            triggerAlarm(item, 'RESULT');
                        }
                    }
                }
            });
        }

        // Flash/Highlight row when RESULT time hits
        function highlightResultRow(pasaranId) {
            const rows = document.querySelectorAll('.table-row-item');
            pasaranData.forEach((item, index) => {
                if (item.id === pasaranId && rows[index]) {
                    rows[index].classList.add('bg-emerald-900/40', 'ring-2', 'ring-emerald-400');
                    setTimeout(() => {
                        if (rows[index]) {
                            rows[index].classList.remove('ring-2', 'ring-emerald-400');
                        }
                    }, 10000);
                }
            });
        }

        // Trigger Alarm Sound & Popup
        function triggerAlarm(item, type) {
            document.getElementById('modalPasaranName').innerText = item.name;
            document.getElementById('modalPasaranTime').innerText = `JAM RESULT KELUAR: ${item.result}`;
            document.getElementById('alarmModal').classList.remove('hidden');

            playLoudSiren();
        }

        // Play Continuous Siren Tone
        function playLoudSiren() {
            initAudioCtx();
            stopSirenSound();

            let frequency = 700;
            let goingUp = true;

            alarmInterval = setInterval(() => {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sawtooth';
                    
                    if (goingUp) {
                        frequency += 100;
                        if (frequency >= 1200) goingUp = false;
                    } else {
                        frequency -= 100;
                        if (frequency <= 700) goingUp = true;
                    }

                    osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } catch (e) {
                    console.error("Audio error:", e);
                }
            }, 160);
        }

        function stopSirenSound() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        function stopCurrentAlarm() {
            stopSirenSound();
            document.getElementById('alarmModal').classList.add('hidden');
        }

        // Initialize Web Audio Context
        function initAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Toggle Audio Button State
        function toggleAudio() {
            initAudioCtx();
            isAudioActive = !isAudioActive;

            const btn = document.getElementById('toggleAudioBtn');
            const icon = document.getElementById('audioIcon');
            const text = document.getElementById('audioBtnText');
            const statusText = document.getElementById('audioStatusText');

            if (isAudioActive) {
                btn.className = "bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs sm:text-sm py-2 px-5 rounded-full flex items-center gap-2 transition-all duration-200 shadow-lg cursor-pointer";
                icon.className = "fa-solid fa-volume-xmark";
                text.innerText = "Matikan Suara Alarm";
                statusText.innerText = "Aktif";
                statusText.className = "text-yellow-400 font-bold";
            } else {
                btn.className = "bg-gray-800 hover:bg-gray-700 text-gray-300 font-extrabold text-xs sm:text-sm py-2 px-5 rounded-full flex items-center gap-2 transition-all duration-200 cursor-pointer";
                icon.className = "fa-solid fa-volume-high";
                text.innerText = "Aktifkan Suara Alarm";
                statusText.innerText = "Mati";
                statusText.className = "text-gray-500 font-bold";
                stopSirenSound();
            }
        }

        // Test Alarm Sound
        function testAlarmSound() {
            initAudioCtx();
            isAudioActive = true;
            document.getElementById('audioStatusText').innerText = "Aktif";
            triggerAlarm({ name: "TES RESULT PASARAN", tutup: "12:00 WIB", result: "12:30 WIB" }, "RESULT");
        }

        // Filter Table Pasaran Search
        function filterPasaran() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.getElementById('tableBody').getElementsByTagName('tr');

            for (let i = 0; i < rows.length; i++) {
                const nameTd = rows[i].getElementsByTagName('td')[0];
                if (nameTd) {
                    const txt = nameTd.textContent || nameTd.innerText;
                    rows[i].style.display = txt.toLowerCase().includes(query) ? "" : "none";
                }
            }
        }

        // Reset Status State
        function resetAllStatus() {
            if (confirm("Reset semua status pasaran menjadi Aktif kembali?")) {
                statusState = {};
                localStorage.removeItem('pasaran_status_state');
                renderTable();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
