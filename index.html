<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarm & Jadwal Pasaran - Vibrate Neon Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* BORDER NEON BERGERAK PAS SESUAI BINGKAI KOTAK */
    .app-card-wrapper {
      position: relative;
      border-radius: 1.25rem;
      overflow: hidden;
      padding: 3px;
      background: #18181b;
      isolation: isolate;
    }

    .app-card-wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 270deg,
        #facc15 310deg,
        #ffffff 345deg,
        #facc15 360deg
      );
      animation: rotateNeon 3.5s linear infinite;
      z-index: 0;
    }

    .app-card-inner {
      position: relative;
      background-color: #09090b;
      border-radius: calc(1.25rem - 3px);
      z-index: 1;
    }

    @keyframes rotateNeon {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ANIMASI GETAR UNTUK POPUP ALARM (DIAM DI TEMPAT, BERGETAR) */
    @keyframes vibrateModal {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -2px); }
      60% { transform: translate(-2px, -3px); }
      80% { transform: translate(3px, 3px); }
      100% { transform: translate(0, 0); }
    }

    .modal-vibrate {
      animation: vibrateModal 0.25s infinite ease-in-out;
    }

    body {
      background-color: #050505;
      color: #fef08a;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #ca8a04; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 font-sans">

  <!-- WRAPPER UTAMA -->
  <div class="max-w-4xl w-full mx-auto my-auto app-card-wrapper">
    <div class="app-card-inner p-4 sm:p-6 space-y-6">

      <!-- HEADER & JAM REALTIME -->
      <header class="bg-zinc-950/80 border border-yellow-500/20 rounded-2xl p-4 sm:p-6 text-center shadow-lg">
        <h1 class="text-xs sm:text-sm font-bold uppercase tracking-widest text-yellow-400 mb-1">
          <i class="fa-solid fa-clock mr-1"></i> Waktu Realtime (WIB)
        </h1>
        <div id="clock" class="text-4xl sm:text-6xl font-mono font-extrabold text-white tracking-wider my-2 drop-shadow-[0_0_15px_rgba(250,204,21,0.6)]">00:00:00</div>
        
        <div class="flex flex-wrap items-center justify-center gap-3 mt-4">
          <button id="audio-btn" onclick="toggleAudio()" class="px-4 py-2 bg-yellow-500 hover:bg-yellow-400 text-zinc-950 font-bold rounded-xl text-xs transition shadow-[0_0_15px_rgba(234,179,8,0.5)] flex items-center gap-2">
            <i class="fa-solid fa-volume-high"></i> Aktifkan Suara Alarm
          </button>
          <span id="audio-status" class="text-xs text-yellow-200/70 font-medium">Status Suara: <b class="text-red-400">Nonaktif</b></span>
        </div>
      </header>

      <!-- MAIN CONTAINER: TABEL JADWAL -->
      <main class="bg-zinc-950/80 border border-yellow-500/20 rounded-2xl p-4 sm:p-6 space-y-4 shadow-lg">
        <div class="flex flex-col sm:flex-row justify-between items-center gap-3 border-b border-yellow-500/20 pb-4">
          <h2 class="text-base font-bold text-white uppercase tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-list-check text-yellow-400"></i> Daftar Jadwal Pasaran & Live Draw
          </h2>
          <input type="text" id="search-input" onkeyup="filterTable()" placeholder="Cari nama pasaran..." class="w-full sm:w-64 bg-zinc-900 border border-yellow-500/30 rounded-xl px-3 py-1.5 text-xs text-yellow-200 focus:outline-none focus:border-yellow-400 font-mono">
        </div>

        <!-- TABLE CONTAINER -->
        <div class="overflow-x-auto max-h-[480px] overflow-y-auto pr-1 custom-scrollbar">
          <table class="w-full text-left text-xs border-collapse">
            <thead class="sticky top-0 bg-zinc-950 border-b border-yellow-500/20 text-yellow-400 uppercase font-bold text-[11px] z-10">
              <tr>
                <th class="py-3 px-3">Pasaran (Klik untuk Live Draw)</th>
                <th class="py-3 px-3 text-center">Tutup</th>
                <th class="py-3 px-3 text-center">Result</th>
                <th class="py-3 px-3 text-right">Status</th>
              </tr>
            </thead>
            <tbody id="pasaran-table-body" class="divide-y divide-zinc-800/60 font-mono">
              <!-- Data dimasukkan via JS -->
            </tbody>
          </table>
        </div>
      </main>

    </div>
  </div>

  <!-- POPUP NOTIFIKASI ALARM -->
  <div id="alarm-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="app-card-wrapper max-w-sm w-full modal-vibrate">
      <div class="app-card-inner p-6 text-center space-y-4">
        <div class="w-12 h-12 bg-yellow-500/20 text-yellow-400 rounded-2xl flex items-center justify-center mx-auto text-xl border border-yellow-400/50">
          <i class="fa-solid fa-bell"></i>
        </div>
        <h3 id="modal-title" class="text-lg font-extrabold text-white uppercase tracking-wider">ALARM PASARAN</h3>
        <p id="modal-msg" class="text-xs text-yellow-100 leading-relaxed font-mono"></p>
        <button onclick="closeAlarmModal()" class="w-full py-2.5 bg-yellow-500 hover:bg-yellow-400 text-zinc-950 font-bold text-xs rounded-xl transition shadow-[0_0_15px_rgba(234,179,8,0.5)]">
          MATIKAN ALARM
        </button>
      </div>
    </div>
  </div>

  <footer class="max-w-4xl w-full mx-auto text-center text-xs text-yellow-500/60 mt-4">
    Aplikasi Alarm Pasaran &bull; Vibrate Neon Edition WIB
  </footer>

  <script>
    const jadwalData = [

      { nama: "TASMANIA 10", tutup: "10:30", result: "11:00", link: "http://www.tasmanialottery.com/" },

      { nama: "OREGON12", tutup: "11:45", result: "12:00", link: "https://www.oregonlottery.org/pick-4/winning-numbers/" },
      { nama: "BULLSEYE", tutup: "11:45", result: "12:30", link: "https://mylotto.co.nz/results/bullseye" },
      { nama: "FUJIAN 12", tutup: "12:00", result: "12:30", link: "http://www.fujianlottery.com/" },
      { nama: "TASMANIA 13", tutup: "12:30", result: "13:00", link: "http://www.tasmanialottery.com/" },

      { nama: "LIBANON", tutup: "14:30", result: "15:00", link: "https://libanonpools.com/pool/draw" },

      { nama: "CHINA", tutup: "15:00", result: "15:30", link: "https://www.chinapools.asia/" },
      { nama: "FUJIAN 15", tutup: "15:15", result: "15:45", link: "http://www.fujianlottery.com/" },
      { nama: "TOTOMACAU16", tutup: "16:00", result: "16:10", link: "https://www.totomacaupools.club/result.php" },

      { nama: "SINGAPORE", tutup: "17:25", result: "17:45", link: "https://www.singaporepools.com.sg/en/product/Pages/4d_results.aspx" },
      { nama: "KAMBOJA", tutup: "18:15", result: "18:30", link: "https://kambojapools.com/pool/draw" },
      { nama: "TOTOMACAU19", tutup: "19:00", result: "19:10", link: "https://www.totomacaupools.club/result.php" },
      { nama: "FUJIAN 20", tutup: "19:30", result: "20:00", link: "http://www.fujianlottery.com/" },
      { nama: "PCSO", tutup: "19:50", result: "20:10", link: "https://www.pcso.gov.ph/SearchLottoResult.aspx" },
      { nama: "TAIWAN", tutup: "20:15", result: "20:45", link: "https://taiwan-lotto.com/" },
      { nama: "YORDANIA4D", tutup: "20:30", result: "21:00", link: "https://www.yordania4d.com/pool/draw" },
      { nama: "TOTOMACAU5D21", tutup: "21:25", result: "21:25", link: "https://kick.com/search?query=studio-live-game" },
      { nama: "CHICAGODAY", tutup: "21:00", result: "21:30", link: "https://www.chicagolottery.world/" },
      { nama: "TOTOMACAU22", tutup: "22:00", result: "22:10", link: "https://www.totomacaupools.club/result.php" },
      { nama: "TOTOMACAU23", tutup: "23:00", result: "23:10", link: "https://www.totomacaupools.club/result.php" },
      { nama: "HONGKONG", tutup: "22:59", result: "23:00", link: "https://kick.com/search?query=hongkong-lotto-official" },
      { nama: "JAKARTA", tutup: "22:30", result: "23:30", link: "https://jakartapools.com/" },
      { nama: "KINGKONG23", tutup: "23:30", result: "23:35", link: "https://kingkongpools.com/results" },
      { nama: "FUJIAN23", tutup: "23:15", result: "23:45", link: "http://www.fujianlottery.com/" },
      { nama: "TOTOMACAU00", tutup: "00:01", result: "00:10", link: "https://www.totomacaupools.club/result.php" },
      { nama: "KENTUCKYMID", tutup: "00:05", result: "00:30", link: "https://www.lotteryusa.com/kentucky/midday-pick-4/" },
      { nama: "FLORIDAMID", tutup: "00:15", result: "00:40", link: "https://www.lotteryusa.com/florida/midday-pick-4/" },
      { nama: "TURKI", tutup: "00:45", result: "01:20", link: "https://turkipools.com/" },
      { nama: "NEWYORKMID", tutup: "01:05", result: "01:45", link: "https://nylottery.ny.gov/draw-game?game=win4" },
      { nama: "CAROLINADAY", tutup: "01:45", result: "02:00", link: "https://www.lotteryusa.com/north-carolina/midday-pick-4/" },
      { nama: "MAROKO", tutup: "02:30", result: "03:00", link: "https://marokopools.com/" },
      { nama: "OREGON3", tutup: "02:45", result: "03:00", link: "https://www.oregonlottery.org/pick-4/winning-numbers/" },
      { nama: "OREGON6", tutup: "05:45", result: "06:00", link: "https://www.oregonlottery.org/pick-4/winning-numbers/" },
      { nama: "TASMANIA06", tutup: "06:30", result: "07:00", link: "http://www.tasmanialottery.com/" },
      { nama: "CHICAGONIGHT", tutup: "07:30", result: "08:00", link: "https://www.chicagolottery.world/" },
      { nama: "FLORIDAEVE", tutup: "08:35", result: "08:55", link: "https://www.lotteryusa.com/florida/pick-4/" },
      { nama: "OREGON9", tutup: "08:45", result: "09:00", link: "https://www.oregonlottery.org/pick-4/winning-numbers/" }
    ];

    let audioContext = null;
    let audioEnabled = false;
    let triggeredAlarms = {};

    function renderTable() {
      const tbody = document.getElementById('pasaran-table-body');
      tbody.innerHTML = '';

      jadwalData.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-yellow-500/10 transition";
        tr.id = `row-${item.nama.replace(/\s+/g, '-')}`;
        tr.innerHTML = `
          <td class="py-3 px-3 font-bold">
            <a href="${item.link}" target="_blank" class="text-yellow-200 hover:text-white underline decoration-yellow-500/50 hover:decoration-white flex items-center gap-1.5 transition">
              <i class="fa-solid fa-external-link-alt text-[10px] text-yellow-400"></i> ${item.nama}
            </a>
          </td>
          <td class="py-3 px-3 text-center text-yellow-400 font-semibold">${item.tutup} WIB</td>
          <td class="py-3 px-3 text-center text-emerald-400 font-semibold">${item.result} WIB</td>
          <td class="py-3 px-3 text-right">
            <span class="status-badge text-[10px] px-2 py-0.5 rounded bg-zinc-800 text-yellow-500 border border-yellow-500/30">AKTIF</span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      audioEnabled = !audioEnabled;
      
      const btn = document.getElementById('audio-btn');
      const status = document.getElementById('audio-status');

      if (audioEnabled) {
        btn.className = "px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl text-xs transition shadow-[0_0_15px_rgba(239,68,68,0.5)] flex items-center gap-2";
        btn.innerHTML = `<i class="fa-solid fa-volume-xmark"></i> Matikan Suara Alarm`;
        status.innerHTML = `Status Suara: <b class="text-yellow-300">Aktif</b>`;
        playBeep(800, 0.2);
      } else {
        btn.className = "px-4 py-2 bg-yellow-500 hover:bg-yellow-400 text-zinc-950 font-bold rounded-xl text-xs transition shadow-[0_0_15px_rgba(234,179,8,0.5)] flex items-center gap-2";
        btn.innerHTML = `<i class="fa-solid fa-volume-high"></i> Aktifkan Suara Alarm`;
        status.innerHTML = `Status Suara: <b class="text-red-400">Nonaktif</b>`;
      }
    }

    function playBeep(freq = 1000, duration = 1) {
      if (!audioEnabled || !audioContext) return;
      try {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.3, audioContext.currentTime);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + duration);
      } catch (e) { console.error(e); }
    }

    let alarmInterval = null;
    function startAlarmSound() {
      if (!audioEnabled) return;
      alarmInterval = setInterval(() => {
        playBeep(1200, 0.3);
      }, 500);
    }

    function stopAlarmSound() {
      if (alarmInterval) clearInterval(alarmInterval);
    }

    function updateClock() {
      const now = new Date();
      const wibOptions = { timeZone: 'Asia/Jakarta', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' };
      const timeStr = now.toLocaleTimeString('id-ID', wibOptions).replace(/\./g, ':');
      
      document.getElementById('clock').innerText = timeStr;

      const currentHM = timeStr.substring(0, 5);

      jadwalData.forEach(item => {
        const rowId = `row-${item.nama.replace(/\s+/g, '-')}`;
        const row = document.getElementById(rowId);
        if (!row) return;
        const badge = row.querySelector('.status-badge');

        if (item.tutup === currentHM) {
          badge.className = "status-badge text-[10px] px-2 py-0.5 rounded bg-yellow-950 text-yellow-300 border border-yellow-400 font-bold animate-pulse";
          badge.innerText = "TUTUP!";

          if (!triggeredAlarms[item.nama + '-tutup-' + currentHM]) {
            triggerAlarm(item.nama, "TUTUP", item.tutup, item.link);
            triggeredAlarms[item.nama + '-tutup-' + currentHM] = true;
          }
        } 
        else if (item.result === currentHM) {
          badge.className = "status-badge text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-400 font-bold animate-pulse";
          badge.innerText = "RESULT!";

          if (!triggeredAlarms[item.nama + '-result-' + currentHM]) {
            triggerAlarm(item.nama, "RESULT", item.result, item.link);
            triggeredAlarms[item.nama + '-result-' + currentHM] = true;
          }
        } else {
          badge.className = "status-badge text-[10px] px-2 py-0.5 rounded bg-zinc-800 text-yellow-500 border border-yellow-500/30";
          badge.innerText = "AKTIF";
        }
      });
    }

    function triggerAlarm(namaPasaran, jenis, waktu, link) {
      startAlarmSound();
      if (navigator.vibrate) navigator.vibrate([500, 250, 500, 250, 500]);

      document.getElementById('modal-title').innerText = `ALARM ${jenis}!`;
      document.getElementById('modal-msg').innerHTML = `Pasaran <b class="text-white">${namaPasaran}</b> telah memasuki waktu ${jenis} pada pukul ${waktu} WIB.<br><br><a href="${link}" target="_blank" class="text-yellow-400 underline font-bold">Klik di sini untuk buka Live Draw</a>`;
      document.getElementById('alarm-modal').style.display = 'flex';
    }

    function closeAlarmModal() {
      stopAlarmSound();
      document.getElementById('alarm-modal').style.display = 'none';
    }

    function filterTable() {
      const input = document.getElementById('search-input').value.toUpperCase();
      const rows = document.querySelectorAll('#pasaran-table-body tr');

      rows.forEach(row => {
        const text = row.cells[0].innerText.toUpperCase();
        row.style.display = text.includes(input) ? '' : 'none';
      });
    }

    window.onload = () => {
      renderTable();
      setInterval(updateClock, 1000);
      updateClock();
    };
  </script>
</body>
</html>
