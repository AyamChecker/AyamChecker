<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Pasaran & Alarm Result Live Draw</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #08080a;
      color: #f0f0f0;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 15px;
    }

    /* Container dengan efek Animated Neon Border 2 Warna */
    .neon-card {
      position: relative;
      width: 100%;
      max-width: 950px;
      background: #0d0e12;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 25px;
      overflow: hidden;
      z-index: 1;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    /* Lapisan animasi border neon berputar */
    .neon-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg 90deg,
        #ffd700 120deg,
        transparent 150deg 240deg,
        #00f3ff 270deg,
        transparent 300deg
      );
      animation: rotateNeon 4s linear infinite;
      z-index: -2;
    }

    /* Inset penutup latar belakang dalam */
    .neon-card::after {
      content: '';
      position: absolute;
      inset: 3px;
      background: #0d0e12;
      border-radius: 17px;
      z-index: -1;
    }

    @keyframes rotateNeon {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Section Jam */
    .clock-section {
      text-align: center;
      padding: 10px 0;
    }

    .clock-title {
      color: #ffd700;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .digital-clock {
      font-family: 'Orbitron', monospace;
      font-size: 3.8rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.2);
      letter-spacing: 4px;
      margin: 10px 0 18px 0;
    }

    /* Controls */
    .controls-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn-alarm-toggle {
      background: linear-gradient(135deg, #d32f2f, #9a0007);
      color: #ffffff;
      border: none;
      padding: 10px 22px;
      border-radius: 30px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(211, 47, 47, 0.5);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-alarm-toggle.active {
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      box-shadow: 0 0 15px rgba(46, 125, 50, 0.5);
    }

    .btn-alarm-toggle:hover {
      transform: translateY(-2px);
      filter: brightness(1.2);
    }

    .btn-secondary {
      background: #1e2029;
      color: #ffd700;
      border: 1px solid #ffd700;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: #ffd700;
      color: #000;
    }

    .status-badge {
      font-size: 0.9rem;
      font-weight: 700;
      color: #aaa;
    }

    .status-badge span {
      color: #00f3ff;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
    }

    /* Header Table Section */
    .table-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .table-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .table-title i {
      color: #ffd700;
    }

    .search-input {
      background: #14161d;
      border: 1px solid #333745;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.9rem;
      outline: none;
      width: 220px;
      transition: border 0.3s;
    }

    .search-input:focus {
      border-color: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }

    /* Table Styling */
    .table-container {
      overflow-x: auto;
      max-height: 550px;
      overflow-y: auto;
    }

    .table-container::-webkit-scrollbar {
      width: 6px;
    }

    .table-container::-webkit-scrollbar-thumb {
      background: #ffd700;
      border-radius: 3px;
    }

    .table-container::-webkit-scrollbar-track {
      background: #111217;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background: #12141c;
      color: #ffd700;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 1px;
      padding: 12px 16px;
      border-bottom: 2px solid #252836;
      z-index: 10;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid #1a1c26;
      font-size: 0.95rem;
      font-weight: 600;
    }

    tr:hover {
      background: rgba(255, 215, 0, 0.03);
    }

    .pasaran-link {
      color: #ffd700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .pasaran-link:hover {
      color: #00f3ff;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
    }

    .time-tutup {
      color: #ffd700;
      font-family: 'Orbitron', monospace;
      font-size: 0.9rem;
    }

    .time-result {
      color: #00f3ff;
      font-family: 'Orbitron', monospace;
      font-size: 0.9rem;
      text-shadow: 0 0 5px rgba(0, 243, 255, 0.3);
    }

    /* Status Badge in Table */
    .btn-status {
      padding: 5px 14px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      border: 1px solid #3a3f54;
      background: #1e212d;
      color: #888;
      transition: all 0.3s ease;
    }

    .btn-status.done {
      background: rgba(0, 255, 136, 0.15);
      border-color: #00ff88;
      color: #00ff88;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
    }

    .tr-alert {
      animation: alertGlow 1s infinite alternate;
      background: rgba(255, 215, 0, 0.15) !important;
    }

    @keyframes alertGlow {
      from { box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.5); }
      to { box-shadow: inset 0 0 25px rgba(255, 215, 0, 0.8); }
    }

    .footer-text {
      text-align: center;
      color: #666;
      font-size: 0.8rem;
      margin-top: 10px;
    }

    /* Modal Alarm */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #12141c;
      border: 2px solid #00f3ff;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .modal-title {
      color: #ffd700;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    .modal-body {
      font-size: 1.1rem;
      margin-bottom: 20px;
      color: #fff;
    }

    .btn-modal-stop {
      background: linear-gradient(135deg, #ff0055, #990033);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
    }

    @media (max-width: 600px) {
      .digital-clock { font-size: 2.5rem; }
      .search-input { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Card Clock Utama dengan Animated Neon Border -->
  <div class="neon-card">
    <div class="clock-section">
      <div class="clock-title">
        <span>⏰</span> WAKTU REALTIME (WIB)
      </div>
      <div class="digital-clock" id="clock">00 : 00 : 00</div>
      <div class="controls-wrapper">
        <button class="btn-alarm-toggle" id="btnAudioToggle" onclick="toggleAudio()">
          <span id="audioIcon">🔇</span>
          <span id="audioText">Aktifkan Suara Alarm</span>
        </button>
        <button class="btn-secondary" onclick="testAlarm()">🔊 Tes Alarm RESULT</button>
        <button class="btn-secondary" onclick="resetChecklist()">🔄 Reset Status</button>
        <div class="status-badge">Status Alarm: <span id="statusAudioText">Mati</span></div>
      </div>
    </div>
  </div>

  <!-- Card Tabel Utama dengan Animated Neon Border -->
  <div class="neon-card">
    <div class="table-header-bar">
      <div class="table-title">
        <i>📋</i> DAFTAR JADWAL PASARAN & LIVE DRAW
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="Cari nama pasaran..." onkeyup="filterTable()">
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>PASARAN (KLIK UNTUK LIVE DRAW)</th>
            <th>TUTUP</th>
            <th>RESULT</th>
            <th>STATUS</th>
          </tr>
        </thead>
        <tbody id="pasaranTableBody">
          <!-- Data di-render melalui JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <div class="footer-text">
    Aplikasi Alarm Pasaran • Dual-Color Neon Animated Edition (WIB)
  </div>

  <!-- Modal Pop-up Alarm RESULT -->
  <div class="modal-overlay" id="alarmModal">
    <div class="modal-content">
      <div class="modal-title">🎉 RESULT KELUAR!</div>
      <div class="modal-body" id="modalText">Pasaran - telah mengeluarkan RESULT!</div>
      <button class="btn-modal-stop" onclick="stopAlarm()">MATIKAN ALARM</button>
    </div>
  </div>

  <script>
    // Data 47 Pasaran Lengkap
    const rawData = [
      ["NEWYORK EVE", "09:10WIB", "09:45WIB", "https://nylottery.ny.gov/draw-game?game=win4"],
      ["KENTUCKY EVE", "09:45WIB", "10:05WIB", "https://www.lotteryusa.com/kentucky/pick-4/"],
      ["CAROLINA EVE", "10:10WIB", "10:22WIB", "https://www.wral.com/evening-pick-3-pick-4-and-cash-5/1075494/"],
      ["TASMANIA 10", "10:30WIB", "11:00WIB", "http://www.tasmanialottery.com/"],
      ["CAMBODIA", "11:20WIB", "11:50WIB", "https://www.magnumcambodia.com/"],
      ["OREGON12", "11:45WIB", "12:00WIB", "https://www.oregonlottery.org/pick-4/winning-numbers/"],
      ["BULLSEYE", "11:45WIB", "12:30WIB", "https://mylotto.co.nz/results/bullseye"],
      ["FUJIAN 12", "12:00WIB", "12:30WIB", "http://www.fujianlottery.com/"],

      ["TOTOMACAU13", "13:00WIB", "13:10WIB", "https://www.totomacaupools.club/result.php"],
      ["SYDNEY", "13:49WIB", "13:50WIB", "https://sydneylotto.com/"],

      ["TOTOMACAU5D15", "15:15WIB", "15:25WIB", "https://www.totomacaupools.club/result.php"],
      ["CHINA", "15:00WIB", "15:30WIB", "https://www.chinapools.asia/"],
      ["FUJIAN 15", "15:15WIB", "15:45WIB", "http://www.fujianlottery.com/"],
      ["TOTOMACAU16", "16:00WIB", "16:10WIB", "https://www.totomacaupools.club/result.php"],
      ["TASMANIA 16", "16:00WIB", "16:30WIB", "http://www.tasmanialottery.com"],
      ["KINGKONG17", "17:00WIB", "17:05WIB", "https://kingkongpools.com/results"],
      ["JAPAN", "16:50WIB", "17:20WIB", "https://japanpools.online/"],
      ["SINGAPORE", "17:25WIB", "17:45WIB", "https://www.singaporepools.com.sg/en/product/Pages/4d_results.aspx"],
      ["KAMBOJA", "18:15WIB", "18:30WIB", "https://kambojapools.com/pool/draw"],
      ["TOTOMACAU19", "19:00WIB", "19:10WIB", "https://www.totomacaupools.club/result.php"],
      ["FUJIAN 20", "19:30WIB", "20:00WIB", "http://www.fujianlottery.com/"],
      ["PCSO", "19:50WIB", "20:10WIB", "https://www.pcso.gov.ph/SearchLottoResult.aspx"],
      ["TAIWAN", "20:15WIB", "20:45WIB", "https://taiwan-lotto.com/"],
      ["YORDANIA4D", "20:30WIB", "21:00WIB", "https://www.yordania4d.com/pool/draw"],
      ["TOTOMACAU5D21", "21:25WIB", "21:25WIB", "https://kick.com/search?query=studio-live-game"],
      ["CHICAGODAY", "21:00WIB", "21:30WIB", "https://www.chicagolottery.world/"],
      ["TOTOMACAU22", "22:00WIB", "22:10WIB", "https://www.totomacaupools.club/result.php"],
      ["TOTOMACAU23", "23:00WIB", "23:10WIB", "https://www.totomacaupools.club/result.php"],
      ["HONGKONG", "22:59WIB", "23:00WIB", "https://kick.com/search?query=hongkong-lotto-official"],
      ["JAKARTA", "22:30WIB", "23:30WIB", "https://jakartapools.com/"],
      ["KINGKONG23", "23:30WIB", "23:35WIB", "https://kingkongpools.com/results"],
      ["FUJIAN23", "23:15WIB", "23:45WIB", "http://www.fujianlottery.com/"],
      ["TOTOMACAU00", "00:01WIB", "00:10WIB", "https://www.totomacaupools.club/result.php"],
      ["KENTUCKYMID", "00:05WIB", "00:30WIB", "https://www.lotteryusa.com/kentucky/midday-pick-4/"],
      ["FLORIDAMID", "00:15WIB", "00:40WIB", "https://www.lotteryusa.com/florida/midday-pick-4/"],
      ["TURKI", "00:45WIB", "01:20WIB", "https://turkipools.com/"],
      ["NEWYORKMID", "01:05WIB", "01:45WIB", "https://nylottery.ny.gov/draw-game/?game=win4"],
      ["CAROLINADAY", "01:45WIB", "02:00WIB", "https://www.lotteryusa.com/north-carolina/midday-pick-4/"],
      ["MAROKO", "02:30WIB", "03:00WIB", "https://marokopools.com/"],
      ["OREGON3", "02:45WIB", "03:00WIB", "https://www.oregonlottery.org/pick-4/winning-numbers/"],
      ["OREGON6", "05:45WIB", "06:00WIB", "https://www.oregonlottery.org/pick-4/winning-numbers/"],
      ["TASMANIA06", "06:30WIB", "07:00WIB", "http://www.tasmanialottery.com/"],
      ["CHICAGONIGHT", "07:30WIB", "08:00WIB", "https://www.chicagolottery.world/"],
      ["FLORIDAEVE", "08:35WIB", "08:55WIB", "https://www.lotteryusa.com/florida/pick-4/"],
      ["OREGON9", "08:45WIB", "09:00WIB", "https://www.oregonlottery.org/pick-4/winning-numbers/"]
    ];

    let audioEnabled = false;
    let audioCtx = null;
    let isAlarmRinging = false;
    let activeOscillators = [];
    let completedItems = JSON.parse(localStorage.getItem('completedResultItems')) || {};
    let triggeredTimes = {};

    function initTable() {
      const tbody = document.getElementById('pasaranTableBody');
      tbody.innerHTML = '';
      
      rawData.forEach((item, index) => {
        const [nama, tutup, result, link] = item;
        const isDone = completedItems[nama] || false;

        const tr = document.createElement('tr');
        tr.id = `row-${index}`;
        tr.innerHTML = `
          <td>
            <a href="${link}" target="_blank" class="pasaran-link">
              ↗ ${nama}
            </a>
          </td>
          <td class="time-tutup">${tutup.replace('.', ':')}</td>
          <td class="time-result">${result.replace('.', ':')}</td>
          <td>
            <button class="btn-status ${isDone ? 'done' : ''}" id="status-btn-${index}" onclick="toggleStatus(${index}, '${nama}')">
              ${isDone ? '✓ SELESAI' : 'AKTIF'}
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleStatus(index, nama) {
      completedItems[nama] = !completedItems[nama];
      localStorage.setItem('completedResultItems', JSON.stringify(completedItems));
      
      const btn = document.getElementById(`status-btn-${index}`);
      if (completedItems[nama]) {
        btn.classList.add('done');
        btn.textContent = '✓ SELESAI';
      } else {
        btn.classList.remove('done');
        btn.textContent = 'AKTIF';
      }
    }

    function resetChecklist() {
      if (confirm("Reset semua status pasaran kembali ke AKTIF?")) {
        completedItems = {};
        localStorage.removeItem('completedResultItems');
        initTable();
      }
    }

    function toggleAudio() {
      if (!audioEnabled) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioEnabled = true;
        document.getElementById('btnAudioToggle').classList.add('active');
        document.getElementById('audioIcon').textContent = '🔔';
        document.getElementById('audioText').textContent = 'Suara Alarm Aktif';
        document.getElementById('statusAudioText').textContent = 'Aktif';
      } else {
        audioEnabled = false;
        document.getElementById('btnAudioToggle').classList.remove('active');
        document.getElementById('audioIcon').textContent = '🔇';
        document.getElementById('audioText').textContent = 'Aktifkan Suara Alarm';
        document.getElementById('statusAudioText').textContent = 'Mati';
        stopAlarm();
      }
    }

    function playSirenSound() {
      if (!audioCtx) return;
      stopAlarm();
      isAlarmRinging = true;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      osc1.type = 'sawtooth';
      osc2.type = 'sine';

      const now = audioCtx.currentTime;
      osc1.frequency.setValueAtTime(800, now);
      osc1.frequency.linearRampToValueAtTime(1400, now + 0.3);
      osc2.frequency.setValueAtTime(400, now);

      gainNode.gain.setValueAtTime(0.3, now);

      osc1.connect(gainNode);
      osc2.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      osc1.start();
      osc2.start();

      activeOscillators = [osc1, osc2];

      // Repeat sirene effect
      this.alarmInterval = setInterval(() => {
        if (!isAlarmRinging || !audioCtx) return;
        const t = audioCtx.currentTime;
        osc1.frequency.cancelScheduledValues(t);
        osc1.frequency.setValueAtTime(800, t);
        osc1.frequency.linearRampToValueAtTime(1400, t + 0.3);
      }, 400);
    }

    function stopAlarm() {
      isAlarmRinging = false;
      if (this.alarmInterval) clearInterval(this.alarmInterval);
      activeOscillators.forEach(osc => {
        try { osc.stop(); } catch(e){}
      });
      activeOscillators = [];
      document.getElementById('alarmModal').classList.remove('show');

      // Clear highlighted rows
      document.querySelectorAll('.tr-alert').forEach(row => row.classList.remove('tr-alert'));
    }

    function triggerAlarmForResult(namaPasaran, rowIndex) {
      // Auto checklist
      completedItems[namaPasaran] = true;
      localStorage.setItem('completedResultItems', JSON.stringify(completedItems));
      
      const btn = document.getElementById(`status-btn-${rowIndex}`);
      if (btn) {
        btn.classList.add('done');
        btn.textContent = '✓ SELESAI';
      }

      // Highlight Row
      const row = document.getElementById(`row-${rowIndex}`);
      if (row) row.classList.add('tr-alert');

      // Play Sound & Show Modal
      if (audioEnabled) {
        playSirenSound();
      }

      document.getElementById('modalText').textContent = `Pasaran ${namaPasaran} telah memasuki JAM RESULT!`;
      document.getElementById('alarmModal').classList.add('show');
    }

    function updateClockAndCheckAlarm() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('clock').textContent = `${hours} : ${minutes} : ${seconds}`;
      const currentTimeStr = `${hours}:${minutes}`;

      // Reset triggered buffer at 00:00:00
      if (hours === '00' && minutes === '00' && seconds === '00') {
        triggeredTimes = {};
      }

      // Check RESULT Alarm match (only at second '00')
      if (seconds === '00') {
        rawData.forEach((item, index) => {
          const [nama, tutup, resultStr] = item;
          const cleanResult = resultStr.replace('WIB', '').replace('.', ':').trim();

          if (cleanResult === currentTimeStr && !triggeredTimes[`${nama}-${cleanResult}`]) {
            triggeredTimes[`${nama}-${cleanResult}`] = true;
            triggerAlarmForResult(nama, index);
          }
        });
      }
    }

    function testAlarm() {
      if (!audioEnabled) {
        toggleAudio();
      }
      triggerAlarmForResult("TES PASARAN", 0);
    }

    function filterTable() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.querySelectorAll('#pasaranTableBody tr');

      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(input) ? '' : 'none';
      });
    }

    // Init App
    initTable();
    setInterval(updateClockAndCheckAlarm, 1000);
    updateClockAndCheckAlarm();
  </script>
</body>
</html>
