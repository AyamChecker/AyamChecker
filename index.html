<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Indonesian Typing Test & Multi-Language Competition | Tribun FastFingers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { background-color: #121212; color: #e4e4e7; font-family: ui-sans-serif, system-ui, sans-serif; }
    .dark-card { background-color: #1e1e20; border: 1px solid #27272a; }
    
    /* Spasi & Kotak Kata Rapi */
    .word-box { display: inline-block; margin-right: 0.65rem; margin-bottom: 0.5rem; }
    .char-default { color: #71717a; }
    .char-correct { color: #f4f4f5; text-shadow: 0 0 5px rgba(255,255,255,0.3); }
    .char-incorrect { color: #ef4444; background: rgba(239, 68, 68, 0.2); border-radius: 2px; }
    .char-current { border-left: 2px solid #ffffff; animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <!-- HEADER NAVBAR -->
  <header class="max-w-7xl w-full mx-auto flex items-center justify-between pb-4 border-b border-zinc-800">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="location.reload()">
      <div class="w-8 h-8 rounded-lg bg-zinc-800 border border-zinc-700 flex items-center justify-center text-white font-mono text-xs font-bold">IO</div>
      <h1 class="text-sm font-extrabold tracking-wider text-white uppercase">TRIBUN FASTFINGERS</h1>
    </div>
    
    <div class="flex items-center gap-3 text-xs">
      <!-- Pilihan Bahasa -->
      <select id="language-select" onchange="changeLanguage()" class="bg-zinc-800 border border-zinc-700 text-white rounded-lg px-2 py-1.5 focus:outline-none">
        <option value="id">Bahasa Indonesia</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <button onclick="startSoloTest()" class="px-3 py-1.5 bg-zinc-800 text-white font-bold rounded-lg border border-zinc-700">Test Solo</button>
      <button onclick="createCompetition()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition">Competition</button>
    </div>
  </header>


  <!-- MAIN CONTAINER (2 KOLOM PERSIS FASTFINGERS) -->
  <main class="max-w-7xl w-full mx-auto my-8 flex-1">

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
      
      <!-- KOLOM KIRI: AREA MENGETIK (2/3 LEBAR) -->
      <div class="lg:col-span-2 space-y-4">
        
        <!-- Info Kompetitor & Bahasa -->
        <div class="text-xs text-zinc-400 flex items-center justify-between">
          <span id="competitors-info"><i class="fa-solid fa-users mr-1"></i> 0 competitors in room</span>
          <span class="px-2.5 py-1 bg-zinc-800 text-zinc-300 border border-zinc-700 rounded-md text-[11px] font-semibold flex items-center gap-1.5">
            <i class="fa-solid fa-globe"></i> Language: <span id="current-lang-text" class="text-white font-bold">Indonesian</span>
          </span>
        </div>

        <!-- Timer Bar & Live WPM -->
        <div class="flex items-center justify-between text-xs text-zinc-400 font-mono py-2 border-t border-b border-zinc-800">
          <div class="flex items-center gap-2 text-zinc-300">
            <i class="fa-regular fa-clock"></i>
            <span id="timer-24h" class="font-bold text-white">23:59:45</span>
          </div>
          <div class="flex items-center gap-4">
            <span id="timer-60s" class="text-white font-bold text-base">01:00</span>
            <button onclick="resetCurrentTest()" class="hover:text-white transition p-1" title="Ulangi"><i class="fa-solid fa-rotate-right"></i></button>
          </div>
        </div>

        <!-- Text Box Area (Teks Tidak Terbatas / Endless) -->
        <div class="dark-card p-6 rounded-2xl relative min-h-[160px] shadow-xl">
          <div id="text-container" class="font-serif text-xl sm:text-2xl leading-relaxed select-none h-[120px] overflow-hidden flex flex-wrap content-start custom-scrollbar"></div>
          <input type="text" id="hidden-input" class="absolute opacity-0 pointer-events-none" autofocus oninput="handleTyping(event)" onkeydown="handleKeyDown(event)">

          <!-- Overlay Klik / Mulai -->
          <div id="start-overlay" onclick="focusInput()" class="absolute inset-0 bg-[#121212]/90 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center cursor-pointer transition p-4 text-center z-10">
            <i class="fa-solid fa-keyboard text-2xl text-zinc-400 mb-2 animate-bounce"></i>
            <span id="overlay-msg" class="text-xs font-bold text-zinc-300">Klik di sini atau mulai mengetik untuk memulai tes</span>
          </div>
        </div>

        <!-- Realtime Progress Lawan & Pemenang -->
        <div id="progress-box" class="dark-card p-4 rounded-xl space-y-2">
          <div class="flex justify-between items-center text-xs font-bold">
            <span class="text-zinc-400">Progress Lawan:</span>
            <span id="opp-wpm" class="text-emerald-400 font-mono">0 WPM</span>
          </div>
          <div class="w-full bg-zinc-900 rounded-full h-2 overflow-hidden border border-zinc-800">
            <div id="opp-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
          </div>
          <div id="winner-banner" class="hidden p-3 bg-emerald-950/80 border border-emerald-500 text-emerald-300 text-center font-bold text-xs rounded-xl animate-pulse"></div>
        </div>

      </div>


      <!-- KOLOM KANAN: KOTAK SHARE THIS COMPETITION (1/3 LEBAR) -->
      <div class="space-y-4">
        <div class="dark-card p-5 rounded-2xl space-y-4">
          <h3 class="text-sm font-bold text-white border-b border-zinc-800 pb-3">
            Share this competition
          </h3>

          <p class="text-xs text-zinc-400">
            Invite your friends by sharing this link:
          </p>

          <div class="flex items-center gap-1 bg-zinc-900 border border-zinc-700/80 rounded-xl p-1">
            <input type="text" id="share-link-input" readonly class="w-full bg-transparent px-3 py-1.5 text-xs text-zinc-300 font-mono focus:outline-none" placeholder="Klik 'Competition' untuk salin link">
            <button onclick="copyShareLink()" class="p-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 hover:text-white rounded-lg transition border border-zinc-700">
              <i class="fa-regular fa-copy text-sm"></i>
            </button>
          </div>
        </div>
      </div>

    </div>

  </main>


  <!-- FOOTER -->
  <footer class="max-w-7xl w-full mx-auto text-center text-xs text-zinc-600 pt-6 border-t border-zinc-900">
    Tribun FastFingers &bull; Indonesian & Multi-Language Edition
  </footer>


  <script>
    // Bank Kata Luas (200+ Kosakata Terpopuler)
    const wordDictionaries = {
      id: [
        "yang", "untuk", "pada", "adalah", "dengan", "dengan", "dari", "dalam", "tidak", "akan", 
        "juga", "atau", "oleh", "bisa", "sudah", "lebih", "dapat", "tahun", "banyak", "antara", 
        "seperti", "hanya", "mereka", "harus", "saat", "sangat", "karena", "karena", "seperti", 
        "orang", "maka", "satu", "dunia", "anak", "kita", "hari", "secara", "baru", "satu", 
        "pemerintah", "satu", "sebagai", "dua", "ia", "dapat", "bagi", "sampai", "bahwa", "satu", 
        "tempat", "satu", "telah", "bila", "besar", "kembali", "luar", "setelah", "sendiri", 
        "waktu", "dapat", "namun", "tersebut", "masih", "lain", "baik", "terus", "jadi", "hidup", 
        "muda", "lama", "tapi", "selalu", "jalan", "paling", "bukan", "mana", "tangan", "tamu", 
        "kata", "melihat", "makanan", "rumah", "mobil", "motor", "buku", "meja", "kursi", "pagi", 
        "siang", "malam", "sore", "air", "api", "batu", "kayu", "daun", "bunga", "bapak", "ibu", 
        "teman", "kerja", "sekolah", "pasar", "toko", "uang", "baju", "celana", "sepatu", "topi", 
        "lampu", "pintu", "jendela", "kertas", "pulpen", "satu", "dua", "tiga", "empat", "lima", 
        "enam", "tujuh", "delapan", "sembilan", "sepuluh", "pusat", "ingin", "sekali", "memang", 
        "mata", "khusus", "sedang", "pulang", "tidur", "makan", "minum", "teknologi", "komputer", 
        "jaringan", "sistem", "informasi", "dunia", "negara", "rakyat", "bangsa", "keluarga", 
        "cerita", "pikir", "suara", "kasih", "cinta", "semangat", "sukses", "impian", "rencana"
      ],
      en: [
        "the", "be", "to", "of", "and", "a", "in", "that", "have", "I", "it", "for", "not", 
        "on", "with", "he", "as", "you", "do", "at", "this", "but", "his", "by", "from", 
        "they", "we", "say", "her", "she", "or", "an", "will", "my", "one", "all", "would", 
        "there", "their", "what", "so", "up", "out", "if", "about", "who", "get", "which", 
        "go", "me", "when", "make", "can", "like", "time", "no", "just", "him", "know", 
        "take", "people", "into", "year", "your", "good", "some", "could", "them", "see", 
        "other", "than", "then", "now", "look", "only", "come", "its", "over", "think", 
        "also", "back", "after", "use", "two", "how", "our", "work", "first", "well", "way"
      ],
      es: [
        "que", "de", "no", "a", "la", "el", "es", "y", "en", "lo", "un", "por", "qué",
        "me", "una", "te", "los", "se", "con", "para", "mi", "está", "si", "bien", "esos",
        "pero", "más", "hacer", "todo", "como", "nada", "casa", "vida", "mundo", "tiempo"
      ]
    };

    let currentLang = 'id';
    let peer = null;
    let conn = null;
    let isHost = false;
    let isMultiplayer = false;
    let charIndex = 0;
    let correctChars = 0;
    let totalTyped = 0;
    let allSpans = [];
    let timer = null;
    let timeLeft = 60;
    let isStarted = false;
    let isFinished = false;

    window.onload = () => {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        const urlParams = new URLSearchParams(window.location.search);
        const room = urlParams.get('room');
        if (room) {
          joinCompetitionAuto(room);
        } else {
          generateEndlessWords(150);
        }
      });

      peer.on('connection', (c) => {
        conn = c;
        setupConnection();
      });
    };

    function changeLanguage() {
      currentLang = document.getElementById('language-select').value;
      const langNames = { id: 'Indonesian', en: 'English', es: 'Español' };
      document.getElementById('current-lang-text').innerText = langNames[currentLang];
      resetCurrentTest();
    }

    // Fungsi pengacak kata dinamis tanpa batas
    function generateEndlessWords(count) {
      const dict = wordDictionaries[currentLang] || wordDictionaries['id'];
      const selectedWords = [];
      for (let i = 0; i < count; i++) {
        // Menggunakan Math.random() murni agar urutan kata selalu berbeda
        const randomIndex = Math.floor(Math.random() * dict.length);
        selectedWords.push(dict[randomIndex]);
      }
      renderWords(selectedWords);

      if (conn && conn.open && isHost) {
        conn.send({ type: 'words', words: selectedWords });
      }
    }

    function renderWords(words) {
      const textContainer = document.getElementById('text-container');
      textContainer.innerHTML = '';
      allSpans = [];
      charIndex = 0;

      words.forEach(word => {
        const wordBox = document.createElement('div');
        wordBox.className = 'word-box';

        for (let j = 0; j < word.length; j++) {
          const span = document.createElement('span');
          span.innerText = word[j];
          span.className = 'char-default';
          wordBox.appendChild(span);
          allSpans.push(span);
        }

        const spaceSpan = document.createElement('span');
        spaceSpan.innerText = ' ';
        spaceSpan.className = 'char-default';
        wordBox.appendChild(spaceSpan);
        allSpans.push(spaceSpan);

        textContainer.appendChild(wordBox);
      });

      if (allSpans.length > 0) {
        allSpans[0].classList.add('char-current');
      }
    }

    function createCompetition() {
      isMultiplayer = true;
      isHost = true;
      const shareUrl = window.location.origin + window.location.pathname + '?room=' + peer.id;
      document.getElementById('share-link-input').value = shareUrl;
      generateEndlessWords(150);
    }

    function joinCompetitionAuto(roomCode) {
      isMultiplayer = true;
      isHost = false;
      conn = peer.connect(roomCode, { reliable: true });

      document.getElementById('share-link-input').value = window.location.href;
      document.getElementById('overlay-msg').innerText = "Menghubungkan ke Room Kompetisi...";
      setupConnection();
    }

    function setupConnection() {
      if (!conn) return;

      conn.on('open', () => {
        document.getElementById('competitors-info').innerHTML = `<i class="fa-solid fa-users mr-1"></i> 2 competitors in room`;
        document.getElementById('overlay-msg').innerText = "Klik di sini atau mulai mengetik untuk memulai tes";

        if (isHost) {
          generateEndlessWords(150);
        }
      });

      conn.on('data', (data) => {
        if (data.type === 'words') {
          renderWords(data.words);
        } else if (data.type === 'progress') {
          document.getElementById('opp-bar').style.width = data.progress + '%';
          document.getElementById('opp-wpm').innerText = data.wpm + ' WPM';
        } else if (data.type === 'finished') {
          showWinner("Lawan telah menyelesaikan tes terlebih dahulu!");
        }
      });
    }

    function focusInput() {
      if (isFinished) return;
      document.getElementById('hidden-input').focus();
      document.getElementById('start-overlay').style.display = 'none';
      startTimer();
    }

    function startTimer() {
      if (!isStarted) {
        isStarted = true;
        timer = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            let secs = timeLeft < 10 ? '0' + timeLeft : timeLeft;
            document.getElementById('timer-60s').innerText = `00:${secs}`;
          } else {
            endTest();
          }
        }, 1000);
      }
    }

    function handleKeyDown(e) {
      if (isFinished) return;
      startTimer();

      if (e.key === 'Backspace') {
        if (charIndex > 0) {
          charIndex--;
          allSpans[charIndex].className = 'char-default';
          allSpans.forEach(s => s.classList.remove('char-current'));
          allSpans[charIndex].classList.add('char-current');
        }
        e.preventDefault();
      }
    }

    function handleTyping(e) {
      if (isFinished) return;
      const typedVal = document.getElementById('hidden-input').value;
      if (!typedVal) return;

      const currentCharTyped = typedVal.slice(-1);
      document.getElementById('hidden-input').value = '';

      if (charIndex >= allSpans.length) return;

      const targetChar = allSpans[charIndex].innerText;
      allSpans[charIndex].classList.remove('char-default', 'char-current');

      if (currentCharTyped === targetChar) {
        allSpans[charIndex].classList.add('char-correct');
        correctChars++;
      } else {
        allSpans[charIndex].classList.add('char-incorrect');
      }

      charIndex++;

      if (charIndex < allSpans.length) {
        allSpans[charIndex].classList.add('char-current');
        allSpans[charIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      sendProgress();
    }

    function sendProgress() {
      const progress = Math.round((charIndex / allSpans.length) * 100);
      const elapsedMinutes = (60 - timeLeft) / 60 || 0.001;
      const wpm = Math.round((correctChars / 5) / elapsedMinutes);

      if (isMultiplayer && conn && conn.open) {
        conn.send({ type: 'progress', progress, wpm });
      }
    }

    function showWinner(message) {
      isFinished = true;
      clearInterval(timer);
      const banner = document.getElementById('winner-banner');
      banner.innerText = message;
      banner.classList.remove('hidden');
      document.getElementById('start-overlay').style.display = 'flex';
      document.getElementById('overlay-msg').innerText = message;
    }

    function endTest() {
      isFinished = true;
      clearInterval(timer);
      const elapsedMinutes = 1;
      const finalWpm = Math.round((correctChars / 5) / elapsedMinutes);
      showWinner(`Waktu Habis! Hasil Anda: ${finalWpm} WPM.`);
    }

    function resetCurrentTest() {
      clearInterval(timer);
      isStarted = false;
      isFinished = false;
      timeLeft = 60;
      charIndex = 0;
      correctChars = 0;
      totalTyped = 0;
      document.getElementById('timer-60s').innerText = "01:00";
      document.getElementById('winner-banner').classList.add('hidden');
      document.getElementById('start-overlay').style.display = 'flex';
      document.getElementById('overlay-msg').innerText = "Klik di sini atau mulai mengetik untuk memulai tes";
      generateEndlessWords(150);
    }

    function startSoloTest() {
      isMultiplayer = false;
      resetCurrentTest();
    }

    function copyShareLink() {
      const linkInput = document.getElementById('share-link-input');
      if (!linkInput.value) {
        createCompetition();
      }
      linkInput.select();
      navigator.clipboard.writeText(linkInput.value);
      alert("Link kompetisi berhasil disalin! Bagikan ke teman Anda.");
    }
  </script>
</body>
</html>
